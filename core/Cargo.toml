[package]
name = "sansim"
version = "0.1.0"
edition = "2021"
description = "Outdoor road traffic noise propagation: CNOSSOS-EU emission, 3D image sources on arbitrary barrier profiles, impedance ground, Fresnel diffraction, refraction classes, turbulence, parabolic equation."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]

[dependencies]
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", default-features = false, features = ["small_rng"] }
wasm-bindgen = { version = "=0.2.100", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
